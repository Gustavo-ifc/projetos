<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aulas</title>
</head>
<body>
    <h1>CADASTRO DE AULAS</h1>
    <form action="index.php" method="post" enctype="multipart/form-data">
        <fieldset>
            <legend>Formulário</legend>
            <label for="id">Id:</label>
            <input type="text" name="id" readonly value={id}>
            <label for="instrutor">Intrutor:</label>
            <input type="text" name="instrutor" value={instrutor}>
            <label for="Aluno">Aluno:</label>
            <input type="text" name="aluno" value={aluno}>
            <label for="Data">Data</label>
            <input type="date" name="data" value={data_aula}>
            <label for="Hora">Horario:</label>
            <input type="time" name="hora" value={hora}>
            <label for="Veiculo">Veiculo:</label>
            <input type="text" name="veiculo" value={veiculo}>
            <label for="anexo">Anexo:</label>
            <input type="file" name="anexo" value={anexo}>
            <button type="submit" name="acao" value="salvar">Salvar</button>
            <button type="submit" name="acao" value="excluir">Excluir</button>
            <input type="reset" value="Cancelar">
        </fieldset>
    </form>
</body>
</html>
